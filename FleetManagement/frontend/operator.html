<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FleetControl · Portal del conductor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="operator-shell">
  <header class="operator-header">
    <div class="brand">
      <div class="brand-mark">🚚</div>
      <div>
        FleetControl
        <div class="brand-sub">Portal del conductor</div>
      </div>
    </div>
    <div class="flex items-center gap-12">
      <span class="text-sm text-muted">👤 <span id="userFullName">—</span></span>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Salir</button>
    </div>
  </header>

  <div class="operator-content">

    <div id="noRouteState" class="no-route-state hidden">
      <div class="big-icon">🅿️</div>
      <h3>Sin ruta asignada por ahora</h3>
      <p class="text-sm mt-8">Cuando el despachador le asigne una ruta, aparecerá aquí automáticamente.</p>
      <button id="refreshRouteBtn" class="btn btn-secondary btn-sm mt-16">↻ Actualizar</button>
    </div>

    <div id="routeContent" class="hidden">
      <div class="panel panel-body">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="route-card-title" id="routeName">—</h2>
            <span class="badge" id="routeStatusBadge">—</span>
          </div>
          <select id="routeStatusSelect" style="font-size:12px;">
            <option value="Planned">Planificada</option>
            <option value="InProgress">En progreso</option>
            <option value="Delayed">Retrasada</option>
            <option value="Completed">Completada</option>
          </select>
        </div>

        <div class="route-card-meta">
          <span>📏 <strong id="routeDistance">—</strong></span>
          <span>⏱️ <strong id="routeDuration">—</strong></span>
          <span>📅 <strong id="routeScheduled">—</strong></span>
          <span id="routeDelayWrap" class="hidden">🔺 <strong id="routeDelay" style="color:var(--status-maintenance)">—</strong></span>
        </div>

        <div id="operatorMap" class="operator-map"></div>

        <h3 class="mt-16" style="font-size:13px;">Paradas del recorrido</h3>
        <ul class="waypoint-list" id="waypointList"></ul>

        <h3 class="mt-16" style="font-size:13px;">Carga a transportar</h3>
        <ul class="cargo-list" id="cargoList"></ul>
      </div>

      <div class="panel panel-body mt-16">
        <h3 style="font-size:13px;">Otras rutas asignadas</h3>
        <div id="otherRoutesList" class="text-sm text-muted mt-8">—</div>
      </div>
    </div>

  </div>

  <div class="action-bar" id="actionBar" style="display:none;">
    <button id="reportAlertBtn" class="btn btn-danger">🚨 Reportar complicación</button>
    <button id="openNavigationBtn" class="btn btn-primary">🧭 Abrir navegación</button>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastStack" class="toast-stack"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/operator.js"></script>
</body>
</html>
