<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Flotas - En Vivo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { height: 100vh; margin: 0; background-color: #f8f9fa; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        .sidebar { height: 100vh; overflow-y: auto; background: white; border-right: 1px solid #dee2e6; }
        .log-box { background: #212529; color: #00ff66; font-family: monospace; font-size: 0.8rem; height: 150px; overflow-y: auto; }
        .list-group-item.active-vehicle { background-color: #e2f0d9 !important; border-color: #595959 !important; }
    </style>
</head>
<body>

    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Panel Lateral (Sidebar) -->
            <div class="col-md-4 p-4 sidebar d-flex flex-column justify-content-between">
                <div>
                    <h3 class="fw-bold text-primary mb-2">🚚 FleetManagement</h3>
                    <p class="text-muted small">Monitoreo autónomo de alta velocidad.</p>
                    
                    <div class="d-grid gap-2 mb-3">
                        <button class="btn btn-outline-secondary btn-sm fw-bold" onclick="resetSelection()">Ver Toda la Flota</button>
                    </div>

                    <hr>
                    <h5 class="mb-3">Vehículos en Operación</h5>
                    <div id="vehicle-list" class="list-group">
                        <div class="text-center text-muted py-4">Cargando flota...</div>
                    </div>
                </div>

                <!-- Consola Visual de Auditoría (Singleton) -->
                <div class="mt-3">
                    <span class="fw-bold small text-secondary">🔒 Bitácora de Auditoría (Singleton Live):</span>
                    <div id="audit-log" class="log-box p-2 rounded mt-1">Iniciando sistema de alta velocidad...</div>
                </div>
            </div>

            <!-- Contenedor del Mapa -->
            <div class="col-md-8 p-0">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet.js JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = 'http://localhost:5281/api/fleet';
        
        const map = L.map('map').setView([4.5709, -74.2973], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};
        let selectedVehicleId = null;

        async function loadFleetData() {
            try {
                const response = await fetch(`${API_BASE}/locations`);
                const vehicles = await response.json();

                const listContainer = document.getElementById('vehicle-list');
                listContainer.innerHTML = '';

                vehicles.forEach(vehicle => {
                    const lat = vehicle.latitude;
                    const lng = vehicle.longitude;

                    if (markers[vehicle.id]) {
                        markers[vehicle.id].setLatLng([lat, lng]);
                        markers[vehicle.id].getPopup().setContent(`<b>${vehicle.id} - ${vehicle.licensePlate}</b><br>Estado: ${vehicle.status}<br>Capacidad: ${vehicle.capacityTons} Ton`);
                    } else {
                        const marker = L.marker([lat, lng]).addTo(map);
                        marker.bindPopup(`<b>${vehicle.id} - ${vehicle.licensePlate}</b><br>Estado: ${vehicle.status}<br>Capacidad: ${vehicle.capacityTons} Ton`);
                        
                        marker.on('click', () => {
                            toggleSelectVehicle(vehicle.id, lat, lng);
                        });

                        markers[vehicle.id] = marker;
                    }

                    let badgeClass = 'bg-secondary';
                    if (vehicle.status === 'Disponible') badgeClass = 'bg-success';
                    else if (vehicle.status === 'En Ruta') badgeClass = 'bg-primary';
                    else if (vehicle.status === 'Mantenimiento') badgeClass = 'bg-danger';

                    const item = document.createElement('div');
                    item.className = `list-group-item list-group-item-action border-0 shadow-sm mb-2 rounded ${selectedVehicleId === vehicle.id ? 'active-vehicle' : ''}`;
                    item.innerHTML = `
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1 fw-bold">${vehicle.id} (${vehicle.licensePlate})</h6>
                            <span class="badge ${badgeClass}">${vehicle.status}</span>
                        </div>
                        <p class="mb-1 small text-muted">Capacidad: ${vehicle.capacityTons} Toneladas</p>
                        <small class="text-info">Ubicación: [${lat.toFixed(4)}, ${lng.toFixed(4)}]</small>
                    `;
                    
                    item.onclick = () => {
                        toggleSelectVehicle(vehicle.id, lat, lng);
                    };

                    listContainer.appendChild(item);
                });

            } catch (error) {
                console.error('Error al conectar con la API:', error);
            }
        }

        function toggleSelectVehicle(id, lat, lng) {
            if (selectedVehicleId === id) {
                resetSelection();
            } else {
                selectedVehicleId = id;
                map.setView([lat, lng], 13);
                if (markers[id]) markers[id].openPopup();
                loadFleetData();
                appendLog(`Vehículo ${id} seleccionado.`);
            }
        }

        function resetSelection() {
            selectedVehicleId = null;
            const allCoords = Object.values(markers).map(m => m.getLatLng());
            if (allCoords.length > 0) {
                const bounds = L.latLngBounds(allCoords);
                map.fitBounds(bounds, { padding: [50, 50] });
            } else {
                map.setView([4.5709, -74.2973], 6);
            }
            loadFleetData();
            appendLog("Vista general restaurada.");
        }

        async function autoSimulateMovement() {
            try {
                await fetch(`${API_BASE}/simulate-movement`, { method: 'POST' });
                await loadFleetData();
                
                if (selectedVehicleId && markers[selectedVehicleId]) {
                    const currentLatLng = markers[selectedVehicleId].getLatLng();
                    map.setView(currentLatLng, map.getZoom(), { animate: true });
                }
            } catch (err) {
                // Silenciar errores de red menores en bucles rápidos
            }
        }

        function appendLog(text) {
            const logBox = document.getElementById('audit-log');
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div>[${time}] ${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        loadFleetData();
        
        // Intervalo rápido de 1.5 segundos para máxima fluidez
        setInterval(autoSimulateMovement, 1500);
    </script>
</body>
</html>
